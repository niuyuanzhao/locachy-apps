# LOCachy preset: Microsoft Edge (AUR microsoft-edge-stable-bin), on the
# network, with --ozone-platform=wayland: there is no X server. Edge turns on
# elastic overscroll (upstream Chromium has it off on Linux): on Wayland,
# TrackPoint and touchpad scrolling then stretch the page past its edge and
# can leave it there. Chromium keeps only the last --disable-features: other
# features go in the same list. Chosen, it is copied to
# /etc/locachy/containers/edge.conf; values left as they were follow later
# versions of this preset.
package="microsoft-edge-stable-bin"
extras=""
command="/usr/bin/microsoft-edge-stable"
arguments="--ozone-platform=wayland --disable-features=ElasticOverscroll"
network="1"
camera="1"
directories=""
