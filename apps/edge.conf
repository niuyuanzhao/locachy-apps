# LOCachy preset: Microsoft Edge (AUR microsoft-edge-stable-bin), on the
# network, with --ozone-platform=wayland: there is no X server.
#   --use-wayland-explicit-grab   xdg_popup grabs so menus dismiss on outside
#                                 clicks and do not swallow toolbar/Downloads
#   --password-store=basic        container has no Secret Service keyring
#   ElasticOverscroll             off so TrackPoint/circular scroll does not
#                                 stretch pages past their edges on Wayland
#   msSeamlessWebToBrowserSignIn, msEnableWebToBrowserSignIn,
#   msEnableAADWebToBrowserSignIn, msSingleSignOnOneAuthLinux, msSsoByHttpDefer
#                                 disable Edge's normal-profile browser-account
#                                 SSO interception so Outlook web signs in
#                                 directly as InPrivate does
#   msEdgeDownloadPopupTimingAdjustment
#                                 keep the Downloads flyout on download start
#                                 when browser.show_hub_popup_on_download_start
#                                 is enabled instead of deferring it
# Chromium keeps only the last --disable-features: other features go in the
# same list. Chosen, it is copied to /etc/locachy/containers/edge.conf; values
# left as they were follow later versions of this preset.
package="microsoft-edge-stable-bin"
extras=""
command="/usr/bin/microsoft-edge-stable"
arguments="--ozone-platform=wayland --use-wayland-explicit-grab --password-store=basic --disable-features=ElasticOverscroll,msSeamlessWebToBrowserSignIn,msEnableWebToBrowserSignIn,msEnableAADWebToBrowserSignIn,msSingleSignOnOneAuthLinux,msSsoByHttpDefer,msEdgeDownloadPopupTimingAdjustment"
network="1"
camera="1"
directories=""
