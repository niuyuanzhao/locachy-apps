# LOCachy preset: YesPlayMusic (AUR yesplaymusic, third-party NetEase Cloud
# Music player). Upstream bundles Electron 13, which has no Wayland Ozone
# backend and requires the shared Xwayland server (x11="1"); libpulse connects
# audio output to the container's PULSE_SERVER socket, and libappindicator
# registers its tray item on locachy-bar. Chosen, it is copied to
# /etc/locachy/containers/yesplaymusic.conf; values left as they were follow
# later versions of this preset.
package="yesplaymusic"
extras="libnotify libpulse libappindicator"
command="/opt/YesPlayMusic/yesplaymusic"
arguments=""
network="1"
x11="1"
directories=""
