# LOCachy preset: Pear Desktop (pear-desktop, formerly th-ch/youtube-music, a
# YouTube Music client with plugins), on the network. From [cachyos]
# (CachyOS's build of the AUR recipe on electron42); the AUR's recipe where
# [cachyos] lacks it; never pear-desktop-bin, whose bundled Electron trails
# Arch's security updates. Its own window runs Electron's renderer without
# the Chromium sandbox (upstream sets sandbox off); the container's
# namespaces and no_new_privs still hold. Electron 42+ ignores
# ELECTRON_OZONE_PLATFORM_HINT without XDG_SESSION_TYPE=wayland, so pass
# --ozone-platform=wayland explicitly. Chosen, it is copied to
# /etc/locachy/containers/pear-desktop.conf; values left as they were follow
# later versions of this preset.
package="pear-desktop"
extras="libnotify"
command="/usr/bin/pear-desktop"
arguments="--ozone-platform=wayland"
network="1"
directories=""
