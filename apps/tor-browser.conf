# LOCachy preset: Tor Browser (AUR tor-browser-bin) on LOCachy's full-system
# Tor (network layer 1), as on Tails: it runs no tor of its own and speaks
# SOCKS to the system tor, on the shared Wayland display (no X11: x11 is not
# set).
#   network, tor: on locachy-net, Tor only (tor="1"). locachy-app refuses to
#     start it unless service_tor is on and tor-enforce is loaded, and loads a
#     separate nftables table on its cgroup before dstnat that permits only
#     IPv4 TCP to 127.0.0.1:9050 (no direct TCP/UDP/IPv6, no TransPort, no
#     local network), kept until the container exits even if Tor is turned off
#     while it runs.
#   command: /usr/bin/env, which sets these for the bundle and then runs the
#     package wrapper:
#     MOZ_APP_REMOTINGNAME=tor-browser  Firefox names its Wayland window (the
#       app id) by the RemotingName of application.ini, "Tor Browser", which
#       the package .desktop file (StartupWMClass=tor-browser) does not name;
#       with tor-browser the window belongs to this container.
#     TOR_PROVIDER=none  no tor provider: the browser starts no tor and needs
#       no control port; it only sets its proxy (TorProviderNone). Not
#       TOR_SKIP_LAUNCH=1, which still wants a control port, and the system
#       tor gives a container none (a control port could reconfigure it).
#     TOR_SOCKS_HOST=127.0.0.1 TOR_SOCKS_PORT=9050  that proxy: the system
#       tor's SocksPort (TorLauncherUtil.getPreferredSocksConfiguration;
#       remote DNS through it). Without a control port the circuit display
#       and New Tor Circuit for this Site are not there.
#   extras: libmozgtk.so links libgtk-3.so.0, which the package does not
#     depend on; libnotify is dlopen-ed by Firefox for desktop alerts (as in
#     firefox.conf).
#   The wrapper runs its launcher in the foreground (no --detach), so the
#     container lives as long as the browser does.
package="tor-browser-bin"
extras="gtk3 libnotify"
command="/usr/bin/env"
arguments="MOZ_APP_REMOTINGNAME=tor-browser TOR_PROVIDER=none TOR_SOCKS_HOST=127.0.0.1 TOR_SOCKS_PORT=9050 /usr/bin/tor-browser"
network="1"
tor="1"
directories=""
