# LOCachy preset: Tor Browser (AUR tor-browser-bin), on the shared Wayland
# display (no X11: x11 is not set).
#   network, tor: on locachy-net, Tor container (tor="1").
#     When full-system Tor (service_tor) is on and tor-enforce is loaded,
#     locachy-app sets TOR_PROVIDER=none TOR_SOCKS_HOST=127.0.0.1
#     TOR_SOCKS_PORT=9050 (as on Tails: no second tor daemon and no Tor over
#     Tor) and loads a per-cgroup nftables table before dstnat that permits
#     only IPv4 TCP to 127.0.0.1:9050 until the container exits.
#     When full-system Tor is off, home and the desktop launcher warn first and
#     start it with --own-tor (TOR_SOCKS_HOST=127.0.0.1 TOR_SOCKS_PORT=9150),
#     so Tor Browser runs its own bundled user-space tor daemon without the
#     host Tor firewall.
#   command: /usr/bin/env, setting MOZ_APP_REMOTINGNAME=tor-browser so Firefox
#     names its Wayland window app id "tor-browser" to match StartupWMClass in
#     tor-browser.desktop.
#   extras: libmozgtk.so links libgtk-3.so.0, which the package does not
#     depend on; libnotify is dlopen-ed by Firefox for desktop alerts.
#   The wrapper runs its launcher in the foreground (no --detach), so the
#     container lives as long as the browser does.
package="tor-browser-bin"
extras="gtk3 libnotify"
command="/usr/bin/env"
arguments="MOZ_APP_REMOTINGNAME=tor-browser /usr/bin/tor-browser"
network="1"
tor="1"
directories=""
