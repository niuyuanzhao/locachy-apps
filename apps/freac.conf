# LOCachy preset: fre:ac (AUR freac, built from the upstream source with its
# AUR libraries boca and smooth), an audio converter and CD ripper. Its
# toolkit, smooth, draws its windows with Xlib only, so it needs the shared
# Xwayland server (x11="1"); its GTK file dialogs open on the shared display
# itself. BoCA loads the codecs at run time: lame, opus, vorbis, speex,
# mpg123 and mp4v2 come with the package, FLAC and libsndfile with libpulse
# (which also plays through the container's PULSE_SERVER socket); libfdk-aac
# is the AAC encoder (BoCA builds none on faac) and libsamplerate the sample
# rate converter. No network: converting is local (only CD database lookups
# use it, and ripping needs the optical drive, which a container is not
# given). Chosen, it is copied to /etc/locachy/containers/freac.conf; values
# left as they were follow later versions of this preset.
package="freac"
extras="libfdk-aac libsamplerate"
command="/usr/bin/freac"
arguments=""
network="0"
x11="1"
directories=""
