# LOCachy preset: ChatGPT (AUR chatgpt-desktop, which repackages OpenAI's
# official Linux build with its .deb checksum pinned): OpenAI's Owl runtime
# on Chromium 156, with the bundled Codex agent, whose commands run inside
# this container. It is Wayland-native; --ozone-platform=wayland is passed as
# for every Chromium-based preset. A container has no Secret Service, so its
# cookies use Chromium's basic store. It stays in its tray after its window
# closes: stopping it in home ends it. Its .desktop file also lists http and
# https links, so it is among the programs offered for them. On the network.
# Chosen, it is copied to /etc/locachy/containers/chatgpt.conf; values left
# as they were follow later versions of this preset.
package="chatgpt-desktop"
extras=""
command="/usr/bin/chatgpt"
arguments="--ozone-platform=wayland"
network="1"
directories=""
