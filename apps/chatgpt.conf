# LOCachy preset: ChatGPT with OpenAI's Codex agent, with real-system access.
# The store asks before granting it: the agent and its terminal use the real
# root, home, tools and shell as the user, and the network; sudo still needs
# authentication. Its process namespace and cgroup stay managed by home.
# AUR chatgpt-desktop repackages OpenAI's Linux .deb with a pinned checksum.
# Chromium needs --ozone-platform=wayland explicitly. Closing the window
# leaves its tray; stopping it in home ends the whole application.
host="1"
package="chatgpt-desktop"
command="/usr/bin/chatgpt"
arguments="--ozone-platform=wayland"
network="1"
desktop="chatgpt.desktop"
