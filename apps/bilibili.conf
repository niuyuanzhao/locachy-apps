# LOCachy preset: Bilibili (AUR bilibili-bin, the Linux port of the official
# client, Electron 43), on the network. Electron 42+ ignores
# ELECTRON_OZONE_PLATFORM_HINT without XDG_SESSION_TYPE=wayland, so pass
# --ozone-platform=wayland explicitly. Chosen, it is copied to
# /etc/locachy/containers/bilibili.conf; values left as they were follow later
# versions of this preset.
package="bilibili-bin"
extras="libnotify"
command="/usr/bin/bilibili"
arguments="--ozone-platform=wayland"
network="1"
directories=""
