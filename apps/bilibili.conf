# LOCachy preset: Bilibili (AUR bilibili-bin, the Linux port of the official
# client, Electron), on the network. Its launcher lets Electron choose Wayland
# itself (there is no X server) and reads ~/.config/bilibili-flags.conf.
# Chosen, it is copied to /etc/locachy/containers/bilibili.conf; values left as
# they were follow later versions of this preset.
package="bilibili-bin"
extras="libnotify"
command="/usr/bin/bilibili"
arguments=""
network="1"
directories=""
